<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Qora doira (Background) -->
  <circle cx="50" cy="50" r="50" fill="black" />

  <!-- Oq monitor -->
  <g fill="white">
    <!-- Monitor ekrani -->
    <rect x="22" y="26" width="56" height="36" rx="3" ry="3" />
    
    <!-- Monitor oyoqchasi -->
    <rect x="46" y="62" width="8" height="8" />
    
    <!-- Monitor tagligi (poydevori) -->
    <rect x="36" y="70" width="28" height="4" rx="1.5" ry="1.5" />
    
    <!-- Ekranning ichidagi qora qismi (ramka ko'rinishi berish uchun) -->
    <rect x="25" y="29" width="50" height="30" fill="black" rx="1" ry="1" />
  </g>
</svg>
